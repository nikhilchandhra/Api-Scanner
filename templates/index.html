<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Scanner</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1e2130;
    --border: #2a2f45;
    --text: #e6e8ef;
    --muted: #8a90a6;
    --accent1: #6366f1;
    --accent2: #8b5cf6;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .close-btn {
    position: fixed; top: 16px; right: 16px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .close-btn:hover { color: var(--text); border-color: var(--danger); }
  .container {
    max-width: 600px; margin: 0 auto; padding: 80px 20px 40px;
  }
  .logo { text-align: center; margin-bottom: 36px; }
  .logo h1 {
    font-size: 34px; margin: 0;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .logo .subtitle { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 26px; margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 18px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; background: #14161f; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 12px; font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent1); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  button.btn {
    border: none; border-radius: 8px; padding: 11px 18px;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: linear-gradient(90deg, var(--accent1), var(--accent2)); color: #fff; }
  .btn-secondary { background: #262a3d; color: var(--text); border: 1px solid var(--border); }
  .btn-primary:hover { opacity: .92; }
  .btn-secondary:hover { border-color: var(--accent1); }
  .error-box {
    display: none; background: #2a1414; border: 1px solid var(--danger);
    color: #ffb4b4; padding: 12px 14px; border-radius: 8px;
    margin-top: 14px; font-size: 13px;
  }
  .recent h3 { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  .recent-item {
    display: flex; align-items: center; gap: 12px;
    background: #14161f; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .recent-item:hover { border-color: var(--accent1); }
  .recent-item .info { flex: 1; min-width: 0; }
  .recent-item .name { font-size: 14px; font-weight: 600; }
  .recent-item .path { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-item .remove {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 2px 6px;
  }
  .recent-item .remove:hover { color: var(--danger); }
  .scanning-card { display: none; text-align: center; }
  .spinner {
    width: 44px; height: 44px; margin: 0 auto 18px;
    border: 4px solid var(--border); border-top-color: var(--accent2);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-text { font-size: 15px; margin-bottom: 6px; }
  .current-file { font-size: 12px; color: var(--muted); margin-bottom: 16px; min-height: 16px; }
  .progress-bar-outer { height: 8px; background: #14161f; border-radius: 99px; overflow: hidden; }
  .progress-bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent1), var(--accent2)); transition: width .3s; }
</style>
</head>
<body>
<button class="close-btn" onclick="closeApp()">✕ Close</button>

<div class="container">
  <div class="logo">
    <h1>⚡ API Scanner</h1>
    <div class="subtitle">Scan your Spring Boot project and explore all APIs</div>
  </div>

  <div class="card" id="mainCard">
    <h2>Open Project</h2>
    <label for="folderInput">Project folder</label>
    <input type="text" id="folderInput" placeholder="C:\path\to\your\spring-boot-project">
    <div class="row">
      <button class="btn btn-secondary" onclick="browseFolder()">📁 Browse</button>
      <button class="btn btn-primary" style="flex:1" onclick="startScan()">Scan</button>
    </div>
    <div class="error-box" id="errorBox"></div>

    <div class="recent" id="recentSection" style="margin-top:22px;"></div>
  </div>

  <div class="card scanning-card" id="scanningCard">
    <div class="spinner"></div>
    <div class="progress-text" id="progressText">Scanning...</div>
    <div class="current-file" id="currentFile"></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
  </div>
</div>

<script>
function escHtml(s){ if(s==null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function escJs(s){ if(s==null) return ""; return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"'); }

function showError(msg){
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}
function hideError(){ document.getElementById('errorBox').style.display = 'none'; }

async function closeApp(){
  try { await fetch('/api/shutdown', {method:'POST'}); } catch(e){}
  try {
    window.close();
  } catch(e){}
  setTimeout(() => {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8a90a6;font-size:18px;">API Scanner stopped. You can close this tab.</div>';
  }, 400);
}

async function browseFolder(){
  try {
    const r = await fetch('/api/browse-folder');
    const d = await r.json();
    if (d.folder) document.getElementById('folderInput').value = d.folder;
  } catch(e){ showError('Could not open folder picker: ' + e.message); }
}

async function loadRecent(){
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    const list = cfg.recent_projects || [];
    const sec = document.getElementById('recentSection');
    if (!list.length){ sec.innerHTML = ''; return; }
    let html = '<h3>Recent Projects</h3>';
    list.forEach(p => {
      const parts = p.replace(/\\/g,'/').split('/').filter(Boolean);
      const name = parts.length ? parts[parts.length-1] : p;
      html += `<div class="recent-item" onclick="scanPath('${escJs(p)}')">
        <span>📁</span>
        <div class="info">
          <div class="name">${escHtml(name)}</div>
          <div class="path">${escHtml(p)}</div>
        </div>
        <button class="remove" onclick="event.stopPropagation();removeRecent('${escJs(p)}')">✕</button>
      </div>`;
    });
    sec.innerHTML = html;
  } catch(e){}
}

async function removeRecent(path){
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    const list = (cfg.recent_projects || []).filter(p => p !== path);
    await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({recent_projects: list})});
    loadRecent();
  } catch(e){}
}

function scanPath(path){
  document.getElementById('folderInput').value = path;
  startScan();
}

let pollTimer = null;
async function startScan(){
  hideError();
  const folder = document.getElementById('folderInput').value.trim();
  if (!folder){ showError('Please enter or select a project folder.'); return; }

  try {
    const r = await fetch('/api/scan', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({folder})});
    const d = await r.json();
    if (d.status === 'error'){ showError(d.message || 'Scan failed.'); return; }
  } catch(e){ showError('Scan request failed: ' + e.message); return; }

  document.getElementById('mainCard').style.display = 'none';
  document.getElementById('scanningCard').style.display = 'block';
  pollProgress();
}

async function pollProgress(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch('/api/scan/progress');
      const p = await r.json();
      const total = p.total || 0;
      const done = p.done || 0;
      document.getElementById('progressText').textContent = `Scanning ${done} / ${total} files...`;
      document.getElementById('currentFile').textContent = p.current || '';
      const pct = total > 0 ? Math.min(100, Math.round(done/total*100)) : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      if (!p.scanning){
        clearInterval(pollTimer);
        window.location.href = '/dashboard';
      }
    } catch(e){}
  }, 400);
}

window.onload = loadRecent;
</script>
</body>
</html>
